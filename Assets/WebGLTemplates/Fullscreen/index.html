<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0c0e; color: #d8d6d0; font-family: "PT Sans", system-ui, sans-serif; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #0b0c0e; outline: none; }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
    #loader .title { font-size: 18px; letter-spacing: 0.04em; }
    #loader .hint { font-size: 13px; opacity: 0.6; }
    #bar { width: min(340px, 70vw); height: 4px; background: #24262b; border-radius: 2px; overflow: hidden; }
    #fill { height: 100%; width: 0; background: #e8c27a; transition: width 0.2s; }
    #error { display: none; max-width: 520px; padding: 0 16px; text-align: center; color: #f0a0a0; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader">
    <div class="title">Загрузка студии…</div>
    <div id="bar"><div id="fill"></div></div>
    <div class="hint">Первый запуск может занять до минуты</div>
    <div id="error"></div>
  </div>
  <script>
    var config = {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
      memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
    };
    var canvas = document.querySelector("#unity-canvas");
    var script = document.createElement("script");
    script.src = "Build/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        document.querySelector("#fill").style.width = (100 * p) + "%";
      }).then(function () {
        document.querySelector("#loader").remove();
        canvas.focus();
      }).catch(function (message) {
        var e = document.querySelector("#error");
        e.style.display = "block";
        e.textContent = "Не удалось запустить: " + message;
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
